# Render Blueprint (Phase 9): the RaceIQ backend in two environments, staging and production.
#
#   per environment   api (web service, image)  ·  worker (background worker, image)  ·  PostgreSQL 16  ·  Key Value
#   frontend          Vercel (see .github/workflows/deploy.yml), proxying /api/* to the api service
#
# Images are built once by GitHub Actions and pushed to GHCR; Render never builds. Deploys are triggered by
# the deploy workflow through each service's deploy hook with the exact image (`imgURL=…@sha256:…`), so
# autoDeploy is off. Before a new api version goes live Render runs its preDeployCommand: the idempotent
# seed (Alembic migrations, the sample sessions, model registry upsert). A failing migration aborts the
# deploy and the previous version keeps serving.
#
# Set up once (docs/runbook.md → "First deploy"): New → Blueprint → this repo; fill the `sync: false`
# values when prompted; add the GHCR registry credential named below; copy each service's deploy hook URL
# into the matching GitHub environment secret.
#
# Secrets are never in this file: `sync: false` values are entered in the Render dashboard, `generateValue`
# ones are generated by Render.

envVarGroups:
  - name: raceiq-common
    envVars:
      - key: RACEIQ_STORAGE_BACKEND
        value: postgres
      - key: RACEIQ_JOB_QUEUE
        value: rq
      # Tyre models are served from the registry baked into the image (/models, file registry): models are
      # promoted by a reviewed commit + deploy (the ML regression gate runs on every change). In-app training
      # needs an S3-compatible bucket and RACEIQ_MODEL_REGISTRY=db (docs/deployment.md).
      - key: RACEIQ_MODEL_REGISTRY
        value: file
      - key: RACEIQ_OBJECT_STORE
        value: local
      - key: RACEIQ_TRUST_PROXY
        value: "true"
      - key: LOG_FORMAT
        value: json
      - key: PORT
        value: "8000"
      # LLM (optional; docs/api_keys.md). Without LLM_API_KEY the engineer serves its template reports.
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ENGINEER_LLM_ENABLED
        value: "true"

projects:
  - name: raceiq
    environments:
      # ------------------------------------------------------------------ staging
      - name: staging
        services:
          - type: web
            name: raceiq-api-staging
            runtime: image
            image:
              url: ghcr.io/devint7/raceiq-backend:main
              creds:
                fromRegistryCreds:
                  name: ghcr-raceiq          # Render → Settings → Registry credentials (GitHub PAT, read:packages)
            plan: starter
            region: oregon
            autoDeploy: false
            healthCheckPath: /api/v1/health
            preDeployCommand: python -m scripts.seed
            envVars:
              - fromGroup: raceiq-common
              - key: APP_ENV
                value: staging
              - key: WEB_CONCURRENCY
                value: "1"
              - key: RACEIQ_DATABASE_URL
                fromDatabase: {name: raceiq-db-staging, property: connectionString}
              - key: RACEIQ_REDIS_URL
                fromService: {type: keyvalue, name: raceiq-kv-staging, property: connectionString}
              - key: RACEIQ_JWT_SECRET
                generateValue: true
              - key: RACEIQ_METRICS_TOKEN
                generateValue: true
              - key: FRONTEND_ORIGIN                 # the staging frontend URL (Vercel), for CORS + the Origin check
                sync: false
              - key: RACEIQ_ADMIN_EMAILS
                sync: false
              - key: SENTRY_DSN                      # API KEY NEEDED (optional): Sentry → backend project DSN
                sync: false
              - key: LLM_API_KEY                     # API KEY NEEDED (optional): the engineer's LLM provider key
                sync: false
          - type: worker
            name: raceiq-worker-staging
            runtime: image
            image:
              url: ghcr.io/devint7/raceiq-worker:main
              creds:
                fromRegistryCreds:
                  name: ghcr-raceiq
            plan: starter
            region: oregon
            autoDeploy: false
            envVars:
              - fromGroup: raceiq-common
              - key: APP_ENV
                value: staging
              - key: RACEIQ_DATABASE_URL
                fromDatabase: {name: raceiq-db-staging, property: connectionString}
              - key: RACEIQ_REDIS_URL
                fromService: {type: keyvalue, name: raceiq-kv-staging, property: connectionString}
              - key: SENTRY_DSN
                sync: false
          - type: keyvalue
            name: raceiq-kv-staging
            plan: starter
            region: oregon
            ipAllowList: []                          # private network only
            maxmemoryPolicy: volatile-lru            # evicts cache entries (all have TTLs), never RQ's job keys
        databases:
          - name: raceiq-db-staging
            databaseName: raceiq
            user: raceiq
            plan: basic-256mb
            region: oregon
            postgresMajorVersion: "16"
            ipAllowList: []

      # ------------------------------------------------------------------ production
      - name: production
        services:
          - type: web
            name: raceiq-api
            runtime: image
            image:
              url: ghcr.io/devint7/raceiq-backend:main
              creds:
                fromRegistryCreds:
                  name: ghcr-raceiq
            plan: standard
            region: oregon
            autoDeploy: false
            healthCheckPath: /api/v1/health
            preDeployCommand: python -m scripts.seed
            envVars:
              - fromGroup: raceiq-common
              - key: APP_ENV
                value: production
              - key: WEB_CONCURRENCY
                value: "2"
              - key: RACEIQ_DATABASE_URL
                fromDatabase: {name: raceiq-db, property: connectionString}
              - key: RACEIQ_REDIS_URL
                fromService: {type: keyvalue, name: raceiq-kv, property: connectionString}
              - key: RACEIQ_JWT_SECRET
                generateValue: true
              - key: RACEIQ_METRICS_TOKEN
                generateValue: true
              - key: FRONTEND_ORIGIN
                sync: false
              - key: RACEIQ_ADMIN_EMAILS
                sync: false
              - key: SENTRY_DSN
                sync: false
              - key: LLM_API_KEY
                sync: false
          - type: worker
            name: raceiq-worker
            runtime: image
            image:
              url: ghcr.io/devint7/raceiq-worker:main
              creds:
                fromRegistryCreds:
                  name: ghcr-raceiq
            plan: standard
            region: oregon
            autoDeploy: false
            envVars:
              - fromGroup: raceiq-common
              - key: APP_ENV
                value: production
              - key: RACEIQ_DATABASE_URL
                fromDatabase: {name: raceiq-db, property: connectionString}
              - key: RACEIQ_REDIS_URL
                fromService: {type: keyvalue, name: raceiq-kv, property: connectionString}
              - key: SENTRY_DSN
                sync: false
          - type: keyvalue
            name: raceiq-kv
            plan: standard
            region: oregon
            ipAllowList: []
            maxmemoryPolicy: volatile-lru
        databases:
          - name: raceiq-db
            databaseName: raceiq
            user: raceiq
            plan: basic-1gb                          # daily managed backups; docs/runbook.md → Backups
            region: oregon
            postgresMajorVersion: "16"
            ipAllowList: []
