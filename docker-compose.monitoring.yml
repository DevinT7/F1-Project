# Prometheus + Grafana for the local stack (Phase 9; docs/monitoring.md):
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Prometheus http://localhost:9090 (alerts: Status → Rules / Alerts), Grafana http://localhost:3001
# (anonymous viewer; the "RaceIQ" dashboard is provisioned). Local only: no auth, no persistence.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [backend]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    depends_on: [prometheus]
