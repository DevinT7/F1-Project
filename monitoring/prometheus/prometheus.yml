# Local Prometheus for the compose stack (docker-compose.monitoring.yml). In production point a hosted
# Prometheus / Grafana Agent at https://<api>/metrics with `authorization: {credentials: <RACEIQ_METRICS_TOKEN>}`
# (docs/monitoring.md); the rules are the same file.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: raceiq-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
