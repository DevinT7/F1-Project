[mypy]
python_version = 3.11
files = app/ingestion, app/storage, app/processing, app/api, app/tires
warn_unused_configs = True

[mypy-app.ingestion.*,app.storage.*,app.processing.*,app.api.*,app.tires.*]
strict = True

[mypy-pyarrow.*,fastf1.*,scipy.*,statsmodels.*,patsy.*]
ignore_missing_imports = True
