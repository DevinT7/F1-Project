[mypy]
python_version = 3.11
files = app/ingestion, app/storage, app/processing, app/api, app/tires, app/ai, app/db, app/auth, app/jobs,
        app/caching.py, app/ratelimit.py, app/objectstore.py
warn_unused_configs = True

[mypy-app.ingestion.*,app.storage.*,app.processing.*,app.api.*,app.tires.*,app.db.*,app.auth.*,app.jobs.*,app.caching,app.ratelimit,app.objectstore]
strict = True

[mypy-pyarrow.*,fastf1.*,scipy.*,statsmodels.*,patsy.*,sklearn.*,joblib.*,xgboost.*,lightgbm.*,shap.*]
ignore_missing_imports = True
