# RaceIQ CI (Phases 8–9). Never calls an LLM provider; needs no secrets.
#
#   backend     lint (ruff) · migrations up/down/up · mypy · OpenAPI drift · tests on Parquet + Postgres +
#               Redis (service containers) with the numerical coverage gate · latency budgets ·
#               mutation sanity checks · golden findings (part of the tests) · pip-audit
#   frontend    typecheck · lint · unit/component tests · npm audit
#   containers  build the api / worker / frontend images · Trivy scan (fixable HIGH/CRITICAL fail) ·
#               docker compose stack with seeded data · restore drill · alert-rule tests · /metrics ·
#               Playwright against it
#   e2e         Playwright against the in-process backend (fixture store, fake-LLM safety test)
name: ci

# Pull requests run it directly; pushes to main and v* tags run it as the first job of deploy.yml (so a
# push runs CI once, and only a green CI builds images and deploys).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel a run a deploy waits on

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: raceiq
          POSTGRES_PASSWORD: raceiq
          POSTGRES_DB: raceiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raceiq -d raceiq_test" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RACEIQ_TEST_DATABASE_URL: postgresql://raceiq:raceiq@localhost:5432/raceiq_test
      RACEIQ_TEST_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pip-audit
      - name: Lint
        run: ruff check app scripts tests
      - name: Migrations are reversible (upgrade → downgrade base → upgrade)
        env:
          RACEIQ_DATABASE_URL: postgresql://raceiq:raceiq@localhost:5432/raceiq_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Type check
        run: python -m mypy
      - name: OpenAPI snapshot is reviewed (and docs/api.md is current)
        run: |
          python -m scripts.export_openapi --check
          python -m scripts.gen_api_docs --check
      - name: Tests with coverage (contract suite, golden findings, cache, jobs, auth, …)
        run: python -m pytest -q -m "not network and not perf" --cov=app --cov-report=json:coverage.json --cov-report=term:skip-covered
      - name: Coverage gate (numerical modules ≥ 90%)
        run: python -m scripts.coverage_gate coverage.json
      - name: Latency budgets (no coverage instrumentation)
        run: python -m pytest -q -m perf
      - name: Mutation sanity checks (planted bugs must be caught)
        run: python -m scripts.mutation_sanity
      - name: Dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck, lint, unit + component tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

  containers:
    runs-on: ubuntu-24.04
    env:
      FRONTEND_PORT: "3000"
      BACKEND_PORT: "8000"
      RACEIQ_TAG: ci
    steps:
      - uses: actions/checkout@v7
      - name: Build the images (api, worker, frontend)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml build
      - name: Image scan (Trivy; fixable HIGH / CRITICAL fail the build)
        run: |
          for image in raceiq-backend:ci raceiq-worker:ci raceiq-frontend:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
              aquasec/trivy:0.67.2 image --quiet --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$image"
          done
      - name: Start the stack (seeded with sample data)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
          timeout 300 bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} $(docker compose ps -q frontend))" = healthy ]; do sleep 3; done'
          docker compose ps
      - name: Restore drill (back up the seeded database, restore into a scratch database, verify every table)
        run: docker compose exec -T -e SOURCE_URL=postgresql://raceiq:raceiq-dev@localhost:5432/raceiq db bash -s < ops/db/restore_drill.sh
      - name: Alert rules (promtool check + unit tests)
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/p" -w /p --entrypoint promtool prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm -v "$PWD/monitoring/prometheus:/p" -w /p --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts_test.yml
      - name: Metrics endpoint serves the documented series
        run: |
          curl -fsS http://localhost:8000/metrics > metrics.txt
          for name in raceiq_http_requests_total raceiq_jobs_total raceiq_job_queue_depth raceiq_tyre_model_baseline_mae_seconds                       raceiq_engineer_requests_total; do
            grep -q "^$name" metrics.txt || { echo "missing $name"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright against the compose stack
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: "true"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.compose.config.ts
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 seed backend worker frontend

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend venv (Playwright starts it from backend/.venv)
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright (in-process backend on the fixture store, fake-LLM injection test)
        working-directory: frontend
        env: {CI: "true"}
        run: npx playwright test
