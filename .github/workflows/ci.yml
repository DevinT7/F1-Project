# RaceIQ CI (Phase 8). Backend tests run against real PostgreSQL + TimescaleDB and Redis service
# containers (the shared repository contract suite runs on both Parquet and Postgres); S3 tests start
# SeaweedFS via testcontainers (Docker is available on the runner). Never calls an LLM provider.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: raceiq
          POSTGRES_PASSWORD: raceiq
          POSTGRES_DB: raceiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raceiq -d raceiq_test" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RACEIQ_TEST_DATABASE_URL: postgresql://raceiq:raceiq@localhost:5432/raceiq_test
      RACEIQ_TEST_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pip-audit
      - name: Migrations are reversible (upgrade → downgrade base → upgrade)
        env:
          RACEIQ_DATABASE_URL: postgresql://raceiq:raceiq@localhost:5432/raceiq_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Type check
        run: python -m mypy
      - name: OpenAPI snapshot is reviewed
        run: python -m scripts.export_openapi --check
      - name: Tests (contract suite on Parquet + Postgres, cache, jobs, auth, …)
        run: python -m pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck, lint, unit + component tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend venv (Playwright starts it from backend/.venv)
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright (real backend on the fixture store, fake LLM injection test)
        working-directory: frontend
        env: {CI: "true"}
        run: npx playwright test
