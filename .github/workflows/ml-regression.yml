# Weekly ML regression check (Phase 9): retrain the production tyre model on the fixed dataset and fail
# if MAE worsens by more than 10% relative to models/ml_regression_baseline.json. Also on demand.
name: ml-regression

on:
  schedule:
    - cron: "17 6 * * 1"          # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrain-and-compare:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Retrain on the fixed dataset and compare with the baseline
        run: python -m scripts.ml_regression | tee ml_regression.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-regression
          path: backend/ml_regression.txt
